<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Muhammad Ali - Contact</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <header>
        <nav>
            <a href="index.html">Home</a>
            <a href="career.html">Career & Achievements</a>
            <a href="gallery.html">Gallery</a>
            <a href="contact.html" class="active">Contact Us</a>
        </nav>
    </header>

    <div class="container">
        <h1 class="main_title">Leave a Comment</h1>

        <div class="details">
            <h2 class="title_inside">For more information please comment</h2>
            
            <form action="#" method="post" class="contact-form">
                <div class="form-group">
                    <label for="name">Your Name:</label>
                    <input type="text" id="name" name="name" placeholder="Enter your name" required>
                </div>

                <div class="form-group">
                    <label for="email">Email Address:</label>
                    <input type="email" id="email" name="email" placeholder="Enter your email" required>
                </div>

                <div class="form-group">
                    <label for="comment">Comment / Message:</label>
                    <textarea id="comment" name="comment" rows="5" placeholder="Write your thoughts about Muhammad Ali..." required></textarea>
                </div>

                <button type="submit" class="btn-submit">Send Message</button>
            </form>
        </div>
    </div>

    <footer>
        <p>&copy; 2026 Tribute to Muhammad Ali Clay. All rights reserved.</p>
    </footer>

</body>
</html>
